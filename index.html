<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小冊子庫存與領取管理系統 | Booklet Inventory & Requisition System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
    /* 手機版設定 (螢幕寬度小於 992px) */
    @media (max-width: 991.98px) {
      .clinic-logo { max-width: 50% !important; }
      .card-header h4 { font-size: 1.1rem; }
      .form-control, .form-select, .btn { font-size: 0.95rem !important; }
      
      /* 將手機版的小冊子列表高度限制為約 3 格 (約 220px) */
      #bookletList {
        max-height: 220px !important;
      }
    }

    /* 電腦版設定 (保持原本高度) */
    @media (min-width: 992px) {
      #bookletList {
        max-height: 480px;
      }
    }

    .en-sub {
      font-size: 0.85rem;
      display: block;
      font-weight: normal;
      opacity: 0.9;
    }
    .badge-location {
      background-color: #0d6efd;
      font-size: 0.85rem;
    }
    .cart-item-qty {
      max-width: 90px;
    }
/* 統一小冊子列表按鈕大小與對齊 */
.booklet-btn {
  min-width: 85px !important;
  text-align: center;
  white-space: nowrap;
}
  </style>
</head>
<body style="background-color: #f0f7f4;">

<div class="container mt-3 mb-5">
  <div class="text-center mb-4">
    <img src="https://assets-apj.mkt.dynamics.com/9059f229-f610-4007-bb68-1c96dc434088/digitalassets/images/aab27902-7659-f111-a825-000d3a8617e0?ts=639154466854471163" 
         alt="Logo" class="img-fluid clinic-logo" style="max-width: 250px; height:auto; object-fit:contain;">
  </div>

  <div class="row g-4">
    <!-- 左側：搜尋與小冊子列表 -->
    <div class="col-lg-7">
      <div class="card shadow-lg h-100">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0 py-1 text-center">
            小冊子目錄與搜尋
            <span class="en-sub">Booklet Search & Selection</span>
          </h4>
        </div>
        <div class="card-body">
          <!-- 搜尋框 -->
          <div class="mb-3">
            <label class="form-label fw-bold">搜尋小冊子 / Search Booklet</label>
            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="輸入關鍵字或編號 (例: 營養 / CC)...">
          </div>

          <!-- 小冊子列表區塊 -->
          <div id="bookletList" class="list-group style-group-flush overflow-auto" style="max-height: 480px;">
            <div class="text-center text-muted py-4" id="loadingText">正在載入小冊子庫存資料... / Loading data...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側：領取表單與購物車 -->
    <div class="col-lg-5">
      <div class="card shadow-lg">
        <div class="card-header bg-dark text-white text-center">
          <h4 class="mb-0 py-1">
            領取清單與同事資料
            <span class="en-sub">Requisition Form & Cart</span>
          </h4>
        </div>
        <div class="card-body">
          <form id="requisitionForm">
            <!-- 同事資料 -->
            <div class="mb-3">
              <label class="form-label fw-bold">領取人姓名 / Staff Name</label>
              <input type="text" name="staff_name" class="form-control" placeholder="請輸入姓名" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-bold">部門 / Department</label>
              <input type="text" name="department" class="form-control" placeholder="例如：教育部 / Education" required>
            </div>

            <hr>

            <!-- 購物車清單 -->
            <h5 class="fw-bold mb-3">已選擇項目 / Selected Items</h5>
            <div id="cartEmptyMsg" class="text-center text-muted py-3 border rounded bg-light mb-3">
              尚未加入任何小冊子<br><small>Please add booklets from the list</small>
            </div>
            
            <ul id="cartList" class="list-group mb-3 d-none"></ul>

            <button type="submit" id="submitBtn" class="btn btn-success btn-lg w-100 mt-2" disabled>
              提交領取申請 / Submit Requisition
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 提示 Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
  <div id="statusToast" class="toast align-items-center text-white border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
    <div class="d-flex">
      <div id="toastMessage" class="toast-body fs-6 fw-bold"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let inventoryData = [];
let cart = [];
let statusToast;

// 1. 頁面初始化：讀取數據 (Scenario 1)
window.addEventListener('DOMContentLoaded', () => {
  statusToast = new bootstrap.Toast(document.getElementById('statusToast'));

  // ⚠️ 請把 Scenario 1 生成的 Webhook URL 貼喺下面括號內
  const fetchUrl = "https://hook.us2.make.com/17rg82gjxt7sskf46yz24uqlwef9n6te"; 

  fetch(fetchUrl)
    .then(res => {
      if (!res.ok) throw new Error("HTTP error " + res.status);
      return res.json();
    })
    .then(data => {
      inventoryData = data.booklets || [];
      renderBookletList(inventoryData);
    })
    .catch(err => {
      console.error("載入失敗：", err);
      document.getElementById("loadingText").textContent = "無法載入庫存資料，請檢查 Webhook 設定。";
    });
});

// 2. 渲染小冊子列表（修正書名顯示全名）
function renderBookletList(items) {
  const container = document.getElementById("bookletList");
  container.innerHTML = "";

  if (items.length === 0) {
    container.innerHTML = '<div class="text-center text-muted py-4">庫存內暫無資料或找不到相關小冊子</div>';
    return;
  }

  items.forEach(item => {
    const stockNum = parseInt(item.stock) || 0;
    const isOutOfStock = stockNum <= 0;
    const div = document.createElement("div");
    div.className = "list-group-item d-flex justify-content-between align-items-start p-3"; // align-items 改為 start
    
    div.innerHTML = `
      <div class="me-3"> <!-- 拿掉 text-truncate -->
        <!-- 書名會完整顯示，太長會自動換行 -->
        <div class="fw-bold fs-6 text-dark">[${item.code || ''}] ${item.title || ''}</div>
        <div class="mt-1">
          <span class="badge badge-location me-2">📍 ${item.location || '未標記'}</span>
          <span class="badge ${isOutOfStock ? 'bg-danger' : 'bg-secondary'}">
            存貨: ${stockNum} 本
          </span>
        </div>
      </div>
      <!-- 按鈕保持對齊右側頂部 -->
      <button class="btn btn-sm ${isOutOfStock ? 'btn-outline-secondary' : 'btn-outline-success'} booklet-btn flex-shrink-0 mt-1" 
              onclick="addToCart('${item.id}')" 
              ${isOutOfStock ? 'disabled' : ''}>
        ${isOutOfStock ? '沒有存貨' : '+ 加入'}
      </button>
    `;
    container.appendChild(div);
  });
}

let isComposing = false; // 紀錄是否正在用輸入法組字中

// 綁定搜尋框事件（完美支援手機中文輸入法）
const searchInput = document.getElementById("searchInput");

// 當開始用中文輸入法打字時
searchInput.addEventListener("compositionstart", () => {
  isComposing = true;
});

// 當中文選字完畢、正式印出中文字時
searchInput.addEventListener("compositionend", () => {
  isComposing = false;
  filterBooklets(); // 選字完成即刻搜尋
});

// 一般即時輸入（適用於英文、數字，或完成選字後）
searchInput.addEventListener("input", () => {
  if (!isComposing) {
    filterBooklets();
  }
});

// 3. 關鍵字搜尋過濾
function filterBooklets() {
  const rawInput = document.getElementById("searchInput").value;
  const query = rawInput.trim().toLowerCase();

  if (!query) {
    renderBookletList(inventoryData);
    return;
  }

  const filtered = inventoryData.filter(item => {
    const title = (item.title || "").toString().toLowerCase();
    const code = (item.code || "").toString().toLowerCase();
    const location = (item.location || "").toString().toLowerCase();

    return title.includes(query) || code.includes(query) || location.includes(query);
  });

  renderBookletList(filtered);
}

// 4. 加入購物車
function addToCart(id) {
  const booklet = inventoryData.find(b => String(b.id) === String(id));
  if (!booklet) return;

  const stockNum = parseInt(booklet.stock) || 0;
  const existingCartItem = cart.find(c => String(c.id) === String(id));
  
  if (existingCartItem) {
    if (existingCartItem.qty < stockNum) {
      existingCartItem.qty += 1;
    } else {
      showToast("已達到現有庫存上限！", false);
      return;
    }
  } else {
    cart.push({ ...booklet, stock: stockNum, qty: 1 });
  }

  updateCartUI();
  showToast(`已加入：${booklet.title}`, true);
}

// 5. 更新購物車 UI
function updateCartUI() {
  const cartList = document.getElementById("cartList");
  const cartEmptyMsg = document.getElementById("cartEmptyMsg");
  const submitBtn = document.getElementById("submitBtn");

  cartList.innerHTML = "";

  if (cart.length === 0) {
    cartEmptyMsg.classList.remove("d-none");
    cartList.classList.add("d-none");
    submitBtn.disabled = true;
    return;
  }

  cartEmptyMsg.classList.add("d-none");
  cartList.classList.remove("d-none");
  submitBtn.disabled = false;

  cart.forEach((item, index) => {
    const li = document.createElement("li");
    li.className = "list-group-item d-flex justify-content-between align-items-center px-2";
    
    li.innerHTML = `
      <div class="me-2 text-truncate" style="max-width: 160px;">
        <small class="fw-bold d-block text-truncate">${item.title}</small>
        <span class="text-muted" style="font-size: 0.75rem;">位置: ${item.location}</span>
      </div>
      <div class="d-flex align-items-center gap-1">
        <input type="number" class="form-control form-control-sm cart-item-qty text-center" 
               min="1" max="${item.stock}" value="${item.qty}" 
               onchange="updateCartQty(${index}, this.value)">
        <button type="button" class="btn btn-sm btn-outline-danger border-0" onclick="removeFromCart(${index})">✕</button>
      </div>
    `;
    cartList.appendChild(li);
  });
}

// 6. 修改購物車數量
function updateCartQty(index, newQty) {
  newQty = parseInt(newQty);
  const maxStock = cart[index].stock;

  if (isNaN(newQty) || newQty < 1) {
    cart[index].qty = 1;
  } else if (newQty > maxStock) {
    cart[index].qty = maxStock;
    showToast(`該小冊子庫存最多只有 ${maxStock} 本`, false);
  } else {
    cart[index].qty = newQty;
  }
  updateCartUI();
}

// 7. 移除購物車項目
function removeFromCart(index) {
  cart.splice(index, 1);
  updateCartUI();
}

// 8. 顯示 Toast 訊息
function showToast(message, isSuccess) {
  const toastEl = document.getElementById('statusToast');
  const msgBody = document.getElementById('toastMessage');
  msgBody.textContent = message;
  
  toastEl.classList.remove('bg-success', 'bg-danger');
  toastEl.classList.add(isSuccess ? 'bg-success' : 'bg-danger');
  statusToast.show();
}

// 9. 提交表單 (Scenario 2)
document.getElementById("requisitionForm").addEventListener("submit", function(e){
  e.preventDefault();
  if(cart.length === 0) return;

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "正在扣減庫存並提交... / Processing...";

  const formData = new FormData(this);
  const payload = {
    staff_name: formData.get("staff_name"),
    department: formData.get("department"),
    items: cart.map(item => ({
      id: item.id,
      code: item.code,
      title: item.title,
      deduct_qty: item.qty
    })),
    timestamp: new Date().toISOString()
  };

  // ⚠️ 請把 Scenario 2 生成的 Webhook URL 貼喺下面括號內
  fetch("https://hook.us2.make.com/gcdgotzqablpj0b1kihmtx8v1j2x30t5", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(res => {
    if (res.ok) {
      showToast("庫存更新及領取紀錄提交成功！", true);
      setTimeout(() => { location.reload(); }, 2500);
    } else {
      throw new Error("提交失敗");
    }
  })
  .catch(err => {
    console.error(err);
    showToast("提交失敗，請檢查網絡或 Scenario 2 設定。", false);
    submitBtn.disabled = false;
    submitBtn.textContent = "提交領取申請 / Submit Requisition";
  });
});
</script>
</body>
</html>
